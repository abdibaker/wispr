[package]
name = "voice-prompt"
version = "0.1.0"
description = "Push-to-talk dictation of prompts for AI coding agents"
authors = ["Abdillah Bakari Ali"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "multipart", "http2"] }
rusqlite = { version = "0.40", features = ["bundled"] }
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }
libpulse-binding = "2.30"
libpulse-simple-binding = "2.29"
evdev = "0.13"
wayland-client = "0.31"
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wl-clipboard-rs = "0.9"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
gtk = "0.18"
notify-rust = { version = "4.18", default-features = false, features = ["z"] }
log = { version = "0.4", features = ["std"] }
anyhow = "1"
async-trait = "0.1"
memfd = "0.6"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
